[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sorx"
version = "0.1.0"
description = "A tool for analyzing CORS headers"
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.32",
    "colorama>=0.4.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
sorx = "sorx.main:main"