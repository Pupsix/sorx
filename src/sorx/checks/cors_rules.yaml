rules:
  ###########################################
  ## Wildcard Origin ########################
  ###########################################

  - id: CORS-001
    title: Wildcard origin
    severity: info
    description: >
      The server allows requests from any origin using a wildcard
      Access-Control-Allow-Origin value.
    evidence: >
      Access-Control-Allow-Origin is set to '*'.
    suggestion: >
      Replace the wildcard with an explicit list of trusted origins.
    example:
      response: |
        Access-Control-Allow-Origin: *


  ###########################################
  ## Origin Reflection ######################
  ###########################################

  - id: CORS-100
    title: Attacker origin reflected
    severity: info
    description: >
      The server reflects an attacker-controlled origin in the
      Access-Control-Allow-Origin response header.
    evidence: >
      The supplied Origin value is reflected in
      Access-Control-Allow-Origin.
    suggestion: >
      Validate the Origin against an explicit allowlist of trusted
      origins instead of reflecting arbitrary origins.
    note: >
      If the target validates the origin against a trusted domain,
      replace the example origin with a domain trusted by the target.
    example:
      request: |
        Origin: https://attacker.example
      response: |
        Access-Control-Allow-Origin: https://attacker.example


  - id: CORS-101
    title: Attacker origin reflected with credentials
    severity: high
    description: >
      The server reflects an attacker-controlled origin and allows
      credentials for cross-origin requests.
    evidence: >
      The supplied Origin value is reflected in
      Access-Control-Allow-Origin and
      Access-Control-Allow-Credentials is set to true.
    suggestion: >
      Restrict Access-Control-Allow-Origin to trusted origins and
      avoid allowing credentials for untrusted origins.
    note: >
      If the target validates the origin against a trusted domain,
      replace the example origin with a domain trusted by the target.
    example:
      request: |
        Origin: https://attacker.example
      response: |
        Access-Control-Allow-Origin: https://attacker.example
        Access-Control-Allow-Credentials: true



  ###########################################
  ## Null Origin ############################
  ###########################################

  - id: CORS-200
    title: Null origin with credentials
    severity: high
    description: >
      The server allows the null origin and credentials for
      cross-origin requests.
    evidence: >
      Access-Control-Allow-Origin is set to 'null' and
      Access-Control-Allow-Credentials is set to true.
    suggestion: >
      Do not allow the null origin with credentials. Restrict CORS
      to trusted origins.
    example:
      request: |
        Origin: null
      response: |
        Access-Control-Allow-Origin: null
        Access-Control-Allow-Credentials: true

  - id: CORS-201
    title: Null origin allowed
    severity: medium
    description: >
      The server explicitly allows the null origin for
      cross-origin requests.
    evidence: >
      Access-Control-Allow-Origin is set to 'null'.
    suggestion: >
      Remove the null origin from the CORS allowlist unless it is
      explicitly required.
    example:
      request: |
        Origin: null
      response: |
        Access-Control-Allow-Origin: null


  ###########################################
  ## Preflight / Request Permissions ########
  ###########################################

  - id: CORS-300
    title: Sensitive request header allowed
    severity: info
    description: >
      The CORS policy allows a sensitive request header such as
      Authorization.
    evidence: >
      A sensitive request header such as Authorization is included
      in Access-Control-Allow-Headers.
    suggestion: >
      Allow only the request headers required by the application and
      avoid permitting sensitive headers unnecessarily.
    example:
      request: |
        Origin: https://attacker.example
        Access-Control-Request-Method: GET
        Access-Control-Request-Headers: Authorization
      response: |
        Access-Control-Allow-Origin: https://attacker.example
        Access-Control-Allow-Headers: Authorization

  - id: CORS-301
    title: Wildcard request headers
    severity: info
    description: >
      The server allows arbitrary request headers through a wildcard
      Access-Control-Allow-Headers value.
    evidence: >
      Access-Control-Allow-Headers is set to '*'.
    suggestion: >
      Replace the wildcard with an explicit list of required
      request headers.
    example:
      request: |
        Origin: https://attacker.example
        Access-Control-Request-Headers: X-Custom-Header
      response: |
        Access-Control-Allow-Headers: *

  - id: CORS-302
    title: Wildcard request methods
    severity: info
    description: >
      The server allows arbitrary HTTP methods through a wildcard
      Access-Control-Allow-Methods value.
    evidence: >
      Access-Control-Allow-Methods is set to '*'.
    suggestion: >
      Replace the wildcard with an explicit list of required
      HTTP methods.
    example:
      request: |
        Origin: https://attacker.example
        Access-Control-Request-Method: DELETE
      response: |
        Access-Control-Allow-Methods: *


  ###########################################
  ## Exposed Response Headers ##############
  ###########################################

  - id: CORS-400
    title: Sensitive response header exposed
    severity: medium
    description: >
      The server exposes a potentially sensitive response header
      through Access-Control-Expose-Headers.
    evidence: >
      A potentially sensitive response header is included in
      Access-Control-Expose-Headers.
    suggestion: >
      Expose only the response headers that the client actually
      requires and avoid exposing sensitive information.
    example:
      response: |
        Access-Control-Expose-Headers: X-Auth-Token


  ###########################################
  ## Origin Validation Bypass ###############
  ###########################################

  - id: CORS-500
    title: Trusted origin validation bypass
    severity: high
    description: >
      The server validates the Origin against a trusted domain using
      an insecure suffix or partial-domain comparison. An attacker
      can register a domain whose hostname ends with the trusted
      domain and have the server treat it as trusted.
    evidence: >
      The supplied attacker-controlled Origin is reflected in
      Access-Control-Allow-Origin and
      Access-Control-Allow-Credentials is set to true, even though
      the origin is not an actual subdomain of the trusted domain.
    suggestion: >
      Parse the origin and compare the hostname against the trusted
      domain using an exact match or a strict subdomain check.
      Avoid using simple string suffix or substring comparisons.
    note: >
      A hostname such as attackerexample.com may satisfy a naive
      check such as hostname.endswith("example.com"), while it is
      not a subdomain of example.com.
    example:
      request: |
        Origin: https://attackerexample.com
      response: |
        Access-Control-Allow-Origin: https://attackerexample.com
        Access-Control-Allow-Credentials: true


  - id: CORS-501
    title: Trusted subdomain validation bypass
    severity: high
    description: >
      The server attempts to restrict CORS to a trusted domain or
      its subdomains, but performs the validation using an unsafe
      hostname suffix comparison.
    evidence: >
      An attacker-controlled hostname containing the trusted domain
      as a suffix is accepted and reflected as the allowed origin.
    suggestion: >
      Require the hostname to equal the trusted domain or end with
      "." followed by the trusted domain. Do not treat arbitrary
      suffix matches as trusted subdomains.
    note: >
      For example, attacker.example.com may be a legitimate
      subdomain, while attackerexample.com is a different domain.
    example:
      request: |
        Origin: https://attackerexample.com
      response: |
        Access-Control-Allow-Origin: https://attackerexample.com
        Access-Control-Allow-Credentials: true


  ###########################################
  ## CORS Combinations ######################
  ###########################################

  - id: CORS-900
    title: Origin reflection with credentials and Authorization
    severity: high
    description: >
      The server reflects an attacker-controlled origin, allows
      credentials, and permits the Authorization request header.
    evidence: >
      The supplied Origin is reflected, credentials are allowed,
      and Authorization is permitted by Access-Control-Allow-Headers.
    suggestion: >
      Restrict allowed origins to trusted domains and avoid allowing
      credentials with untrusted origins or sensitive request headers.
    note: >
      If the target validates the origin against a trusted domain,
      replace the example origin with a domain trusted by the target.
    example:
      request: |
        Origin: https://attacker.example
        Access-Control-Request-Headers: Authorization
      response: |
        Access-Control-Allow-Origin: https://attacker.example
        Access-Control-Allow-Credentials: true
        Access-Control-Allow-Headers: Authorization


  - id: CORS-901
    title: Origin reflection with credentials and sensitive headers
    severity: high
    description: >
      The server reflects an attacker-controlled origin, allows
      credentials, and exposes or permits sensitive headers.
    evidence: >
      The supplied Origin is reflected, credentials are allowed,
      and one or more sensitive headers are exposed or permitted.
    suggestion: >
      Restrict allowed origins and credentials, and avoid exposing
      or permitting sensitive headers unless strictly required.
    note: >
      If the target validates the origin against a trusted domain,
      replace the example origin with a domain trusted by the target.
    example:
      request: |
        Origin: https://attacker.example
      response: |
        Access-Control-Allow-Origin: https://attacker.example
        Access-Control-Allow-Credentials: true
        Access-Control-Expose-Headers: X-Auth-Token


  - id: CORS-902
    title: Origin reflection with credentials and broad methods
    severity: high
    description: >
      The server reflects an attacker-controlled origin, allows
      credentials, and permits broad cross-origin HTTP methods.
    evidence: >
      The supplied Origin is reflected, credentials are allowed,
      and broad or wildcard HTTP methods are permitted.
    suggestion: >
      Restrict allowed origins and credentials, and allow only the
      HTTP methods required by the application.
    note: >
      If the target validates the origin against a trusted domain,
      replace the example origin with a domain trusted by the target.
    example:
      request: |
        Origin: https://attacker.example
        Access-Control-Request-Method: DELETE
      response: |
        Access-Control-Allow-Origin: https://attacker.example
        Access-Control-Allow-Credentials: true
        Access-Control-Allow-Methods: *